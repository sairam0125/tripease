spring.application.name=tripease
server.port=${PORT:8080}

# ---------- Database (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tripease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Security ----------
# Must be at least 32 characters. Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:tripease-dev-secret-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000
# Comma separated. Wildcards allowed, e.g. https://*.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- OpenAI (optional: app falls back to rule-based answers without a key) ----------
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

server.error.include-message=never
logging.level.com.tripease=INFO
