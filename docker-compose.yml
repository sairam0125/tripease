# Local MySQL + backend in one command:   docker compose up --build
# (run the React app separately: cd frontend && npm install && npm run dev)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tripease
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/tripease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: "local-dev-secret-please-change-0123456789abcdef"
      CORS_ORIGINS: "http://localhost:5173"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "8080:8080"

volumes:
  mysql_data:
